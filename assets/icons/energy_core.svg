<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
    </radialGradient>
    <filter id="coreGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 核心主体 -->
  <circle cx="32" cy="32" r="18" fill="url(#coreGrad)" filter="url(#coreGlow)" opacity="0.9"/>
  <!-- 内部能量环 -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <!-- 中心高光 -->
  <circle cx="32" cy="32" r="4" fill="#ffffff" opacity="0.9"/>
  <!-- 能量射线 -->
  <line x1="32" y1="14" x2="32" y2="8" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
  <line x1="32" y1="50" x2="32" y2="56" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
  <line x1="14" y1="32" x2="8" y2="32" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
  <line x1="50" y1="32" x2="56" y2="32" stroke="#00ffff" stroke-width="2" opacity="0.7"/>
  <!-- 对角线射线 -->
  <line x1="20" y1="20" x2="14" y2="14" stroke="#00ffff" stroke-width="1.5" opacity="0.5"/>
  <line x1="44" y1="20" x2="50" y2="14" stroke="#00ffff" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="44" x2="14" y2="50" stroke="#00ffff" stroke-width="1.5" opacity="0.5"/>
  <line x1="44" y1="44" x2="50" y2="50" stroke="#00ffff" stroke-width="1.5" opacity="0.5"/>
</svg>

