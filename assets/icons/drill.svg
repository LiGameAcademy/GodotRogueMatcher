<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="drillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#888888;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#444444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#888888;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="drillTipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8800;stop-opacity:1" />
    </linearGradient>
    <filter id="drillGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 钻头主体 -->
  <rect x="28" y="12" width="8" height="32" rx="2" fill="url(#drillGrad)" filter="url(#drillGlow)" opacity="0.9"/>
  <!-- 钻头尖端 -->
  <polygon points="32,44 28,52 36,52" fill="url(#drillTipGrad)" opacity="0.9"/>
  <!-- 旋转纹理 -->
  <line x1="30" y1="16" x2="34" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="20" x2="34" y2="24" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="24" x2="34" y2="28" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="28" x2="34" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="32" x2="34" y2="36" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <!-- 顶部连接 -->
  <rect x="26" y="8" width="12" height="4" rx="2" fill="#666666" opacity="0.8"/>
  <!-- 火花效果 -->
  <circle cx="28" cy="50" r="1.5" fill="#ffff00" opacity="0.8"/>
  <circle cx="36" cy="50" r="1.5" fill="#ffff00" opacity="0.8"/>
  <circle cx="30" cy="48" r="1" fill="#ff8800" opacity="0.7"/>
  <circle cx="34" cy="48" r="1" fill="#ff8800" opacity="0.7"/>
</svg>

