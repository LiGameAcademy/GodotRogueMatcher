<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8800;stop-opacity:1" />
    </linearGradient>
    <filter id="ampGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 圆形主体 -->
  <circle cx="32" cy="32" r="20" fill="url(#ampGrad)" filter="url(#ampGlow)" opacity="0.9"/>
  <!-- 内部圆环 -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  <!-- 中心点 -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" opacity="0.9"/>
  <!-- 四个方向的信号线 -->
  <line x1="32" y1="12" x2="32" y2="8" stroke="#ffff00" stroke-width="2" opacity="0.8"/>
  <line x1="32" y1="52" x2="32" y2="56" stroke="#ffff00" stroke-width="2" opacity="0.8"/>
  <line x1="12" y1="32" x2="8" y2="32" stroke="#ffff00" stroke-width="2" opacity="0.8"/>
  <line x1="52" y1="32" x2="56" y2="32" stroke="#ffff00" stroke-width="2" opacity="0.8"/>
</svg>

