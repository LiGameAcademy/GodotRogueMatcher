<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00aa00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff00;stop-opacity:1" />
    </linearGradient>
    <filter id="dyeGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 方形主体 -->
  <rect x="16" y="16" width="32" height="32" rx="4" fill="url(#dyeGrad)" filter="url(#dyeGlow)" opacity="0.9"/>
  <!-- 内部网格 -->
  <line x1="24" y1="24" x2="40" y2="24" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="32" x2="40" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="40" x2="40" y2="40" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="24" y1="24" x2="24" y2="40" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="32" y1="24" x2="32" y2="40" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="24" x2="40" y2="40" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <!-- 顶部管道 -->
  <rect x="28" y="8" width="8" height="8" fill="#00ff00" opacity="0.7"/>
  <rect x="30" y="6" width="4" height="2" fill="#00ff00" opacity="0.5"/>
  <!-- 底部出口 -->
  <rect x="28" y="48" width="8" height="4" fill="#00ff00" opacity="0.7"/>
</svg>

