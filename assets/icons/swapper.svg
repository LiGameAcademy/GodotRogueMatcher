<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="swapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>
    <filter id="swapGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 左侧方块 -->
  <rect x="8" y="24" width="16" height="16" rx="2" fill="url(#swapGrad)" filter="url(#swapGlow)" opacity="0.9"/>
  <rect x="10" y="26" width="12" height="12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <!-- 右侧方块 -->
  <rect x="40" y="24" width="16" height="16" rx="2" fill="url(#swapGrad)" filter="url(#swapGlow)" opacity="0.9"/>
  <rect x="42" y="26" width="12" height="12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <!-- 交换箭头（左到右） -->
  <path d="M 24 28 L 36 28 L 32 24 M 36 28 L 32 32" stroke="#00ffff" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- 交换箭头（右到左） -->
  <path d="M 40 36 L 28 36 L 32 40 M 28 36 L 32 32" stroke="#00ffff" stroke-width="2" fill="none" opacity="0.8"/>
  <!-- 中心连接点 -->
  <circle cx="32" cy="32" r="3" fill="#00ffff" opacity="0.6"/>
  <!-- 顶部和底部装饰 -->
  <line x1="16" y1="20" x2="16" y2="16" stroke="#00ffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="48" y1="20" x2="48" y2="16" stroke="#00ffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="44" x2="16" y2="48" stroke="#00ffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="48" y1="44" x2="48" y2="48" stroke="#00ffff" stroke-width="1.5" opacity="0.6"/>
</svg>

