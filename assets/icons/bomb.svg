<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bombGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#880000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:1" />
    </linearGradient>
    <filter id="bombGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 炸弹主体 -->
  <circle cx="32" cy="36" r="16" fill="url(#bombGrad)" filter="url(#bombGlow)" opacity="0.9"/>
  <!-- 内部高光 -->
  <ellipse cx="28" cy="32" rx="6" ry="8" fill="#ffffff" opacity="0.3"/>
  <!-- 引线 -->
  <line x1="32" y1="20" x2="32" y2="8" stroke="#ffaa00" stroke-width="3" opacity="0.8"/>
  <line x1="30" y1="8" x2="34" y2="8" stroke="#ffaa00" stroke-width="2" opacity="0.6"/>
  <!-- 警告符号 -->
  <path d="M 32 24 L 36 32 L 32 36 L 28 32 Z" fill="#ffff00" opacity="0.8"/>
  <line x1="32" y1="28" x2="32" y2="32" stroke="#000000" stroke-width="1.5"/>
  <circle cx="32" cy="34" r="1.5" fill="#000000"/>
  <!-- 爆炸范围指示（虚线圆） -->
  <circle cx="32" cy="36" r="22" fill="none" stroke="#ff0000" stroke-width="1" stroke-dasharray="2,2" opacity="0.4"/>
</svg>

